<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | J&R Frozen Goods</title>
    <!-- Purely external CSS -->
    <link rel="stylesheet" href="../../css/styles.css">
    <link rel="stylesheet" href="../../css/auth.css">
    <link rel="stylesheet" href="../../css/mobile-styles.css" media="(max-width: 375px)">
</head>
<body>

    <!-- Chilled Navigation -->
    <header class="navbar">
        <div class="nav-container">
            <div class="brand">
                <span class="brand-title">J&R Frozen Goods</span>
                <span class="brand-sub">Carni-Flow Cold Storage</span>
            </div>
            <nav class="nav-links">
                <a href="index.html" class="catalog-pill">← Back <span class="hide-text">to Catalog</span></a>
            </nav>
        </div>
    </header>

    <!-- Arctic Auth Hero -->
    <section class="hero auth-hero">

        <!-- Drifting Snowflake Particles -->
        <div class="snow-container" aria-hidden="true">
            <span class="snowflake flake-1">❄</span>
            <span class="snowflake flake-2">❅</span>
            <span class="snowflake flake-3">❄</span>
            <span class="snowflake flake-4">❆</span>
            <span class="snowflake flake-5">❄</span>
            <span class="snowflake flake-6">❅</span>
        </div>

        <div class="auth-wrap">

            <div class="auth-card frost-panel">

                <div class="auth-icon-wrap">
                    <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="11" width="18" height="10" rx="2" ry="2"></rect>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                    </svg>
                </div>

                <h1 class="card-heading auth-heading">Welcome Back</h1>
                <p class="card-sub">Sign in to track orders and save your delivery details.</p>

                <!-- Login / Create Account Tabs -->
                <div class="auth-tabs" role="tablist">
                    <button type="button" class="auth-tab active" id="tab-login" role="tab" aria-selected="true" onclick="switchAuthTab('login')">Sign In</button>
                    <button type="button" class="auth-tab" id="tab-signup" role="tab" aria-selected="false" onclick="switchAuthTab('signup')">Create Account</button>
                </div>

                <!-- Inline status / error banner -->
                <div class="auth-alert hidden" id="auth-alert"></div>

                <!-- Sign In Form -->
                <form id="login-form" class="auth-form" novalidate>
                    <div class="form-group">
                        <label class="form-label" for="login-email">Email Address</label>
                        <input class="form-input" type="email" id="login-email" name="email" placeholder="you@example.com" autocomplete="email" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="login-password">Password</label>
                        <div class="password-field">
                            <input class="form-input" type="password" id="login-password" name="password" placeholder="Enter your password" autocomplete="current-password" required>
                            <button type="button" class="pw-toggle" data-target="login-password" aria-label="Show password">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                    <circle cx="12" cy="12" r="3"></circle>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <div class="auth-row">
                        <label class="remember-me">
                            <input type="checkbox" id="remember-me" name="remember">
                            <span>Remember me</span>
                        </label>
                        <a href="#" class="auth-link" id="forgot-link">Forgot password?</a>
                    </div>

                    <button type="submit" class="btn-submit-order">Sign In</button>
                </form>

                <!-- Create Account Form -->
                <form id="signup-form" class="auth-form hidden" novalidate>
                    <div class="form-group">
                        <label class="form-label" for="signup-name">Full Name</label>
                        <input class="form-input" type="text" id="signup-name" name="name" placeholder="Juan Dela Cruz" autocomplete="name" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="signup-email">Email Address</label>
                        <input class="form-input" type="email" id="signup-email" name="email" placeholder="you@example.com" autocomplete="email" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="signup-password">Password</label>
                        <div class="password-field">
                            <input class="form-input" type="password" id="signup-password" name="password" placeholder="At least 8 characters" autocomplete="new-password" minlength="8" required>
                            <button type="button" class="pw-toggle" data-target="signup-password" aria-label="Show password">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                    <circle cx="12" cy="12" r="3"></circle>
                                </svg>
                            </button>
                        </div>
                        <p class="field-hint">Minimum 8 characters.</p>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="signup-confirm">Confirm Password</label>
                        <input class="form-input" type="password" id="signup-confirm" name="confirm" placeholder="Re-enter your password" autocomplete="new-password" required>
                    </div>

                    <label class="remember-me terms-row">
                        <input type="checkbox" id="agree-terms" required>
                        <span>I agree to the storage &amp; order terms</span>
                    </label>

                    <button type="submit" class="btn-submit-order">Create Account</button>
                </form>

                <p class="guest-note">
                    Just browsing? <a href="index.html" class="auth-link">Continue as guest</a> — no account required to order.
                </p>

            </div>
        </div>
    </section>

    <footer class="footer">
        <p>J&R Frozen Goods • Sangandaan, Caloocan City</p>
    </footer>

    <script src="../../js/auth.js"></script>
</body>
</html>
