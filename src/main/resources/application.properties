spring.application.name=demo
spring.datasource.url=jdbc:postgresql://localhost:5432/frozenmeatsite_db
spring.datasource.username=postgres
spring.datasource.password=me

# This line ensures Spring Boot doesn't accidentally delete or overwrite the tables your groupmate made
spring.jpa.hibernate.ddl-auto=none

# Set CLOUDINARY_URL in the environment; keep the Cloudinary API secret out of source control.
cloudinary.url=${CLOUDINARY_URL:}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

app.delivery.fee=${DELIVERY_FEE:0.00}
app.public-base-url=${APP_PUBLIC_BASE_URL:http://localhost:8081}
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:}
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}